<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="100%" height="100%">
  <defs>
    <!-- Celestial Gradients -->
    <linearGradient id="swRobesDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="swSilkWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="swGoldShine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="swHairLux" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="swBladeBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="swSkinAnime" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fffbeb"/>
      <stop offset="90%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <radialGradient id="swEyeCrystal" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#032b43"/>
    </radialGradient>
    <filter id="swSoftAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="rig-swordsman-master" transform="translate(20, 10)">
    <!-- Dải Lụa Tiên Phong Uốn Lượn Sau Lưng -->
    <path d="M 120 220 C 50 280, 20 380, 60 480 C 40 400, 70 310, 130 250 Z" fill="url(#swRobesDeep)" opacity="0.45" filter="url(#swSoftAura)"/>
    <path d="M 280 220 C 350 280, 380 380, 340 480 C 360 400, 330 310, 270 250 Z" fill="url(#swRobesDeep)" opacity="0.45" filter="url(#swSoftAura)"/>

    <!-- Suối Tóc Dài Bay Trong Gió Linh Khí -->
    <path d="M 175 110 C 130 180, 110 280, 95 380 C 120 300, 150 200, 185 130 Z" fill="url(#swHairLux)"/>
    <path d="M 225 110 C 270 180, 290 280, 305 380 C 280 300, 250 200, 215 130 Z" fill="url(#swHairLux)"/>

    <!-- Tà Áo Dưới: Quần Chiến & Nhiều Lớp Đạo Bào -->
    <path d="M 160 280 C 145 360, 130 430, 120 490 C 150 485, 175 488, 200 490 C 190 430, 185 360, 180 280 Z" fill="url(#swSilkWhite)" stroke="#bae6fd" stroke-width="1.2"/>
    <path d="M 140 270 C 110 360, 90 430, 75 500 C 125 490, 160 495, 180 490 C 150 390, 145 320, 140 270 Z" fill="url(#swRobesDeep)" stroke="url(#swGoldShine)" stroke-width="1.8"/>
    <path d="M 260 270 C 290 360, 310 430, 325 500 C 275 490, 240 495, 220 490 C 250 390, 255 320, 260 270 Z" fill="url(#swRobesDeep)" stroke="url(#swGoldShine)" stroke-width="1.8"/>
    
    <!-- Hài Chiến Thêu Viền Vàng -->
    <path d="M 120 485 C 110 505, 105 515, 130 518 C 145 518, 148 505, 145 485 Z" fill="#0f172a" stroke="url(#swGoldShine)" stroke-width="1.8"/>
    <path d="M 255 485 C 265 505, 270 515, 245 518 C 230 518, 227 505, 230 485 Z" fill="#0f172a" stroke="url(#swGoldShine)" stroke-width="1.8"/>

    <!-- Đạo Bào Giao Lĩnh (Cross-Collar Robe) -->
    <path d="M 155 140 C 175 190, 195 240, 200 275 C 205 240, 225 190, 245 140 Z" fill="url(#swSilkWhite)"/>
    <path d="M 150 145 C 170 195, 188 245, 200 275 C 185 275, 165 230, 145 185 Z" fill="url(#swRobesDeep)" stroke="url(#swGoldShine)" stroke-width="2"/>
    <path d="M 250 145 C 225 200, 208 248, 200 275 C 215 275, 235 230, 255 185 Z" fill="url(#swRobesDeep)" stroke="url(#swGoldShine)" stroke-width="2"/>
    
    <!-- Đai Lưng Thái Cực & Ngọc Bội -->
    <path d="M 150 262 C 175 258, 225 258, 250 262 C 248 282, 225 286, 200 286 C 175 286, 152 282, 150 262 Z" fill="url(#swGoldShine)"/>
    <circle cx="200" cy="274" r="8" fill="#10b981" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="200" cy="274" r="3" fill="#fde047"/>
    <line x1="200" y1="282" x2="200" y2="340" stroke="#fde047" stroke-width="1.8" stroke-dasharray="3,3"/>

    <!-- Ống Tay Áo Rộng Rủ Mềm Mại -->
    <path d="M 150 150 C 105 190, 80 250, 70 310 C 105 300, 135 255, 150 215 Z" fill="url(#swRobesDeep)" stroke="#38bdf8" stroke-width="1.4"/>
    <path d="M 250 150 C 295 190, 320 250, 330 310 C 295 300, 265 255, 250 215 Z" fill="url(#swRobesDeep)" stroke="#38bdf8" stroke-width="1.4"/>

    <!-- Tay Trái Bắt Kiếm Quyết (Sword Incantation Seal) -->
    <path d="M 140 215 C 130 195, 136 178, 142 172 C 148 172, 150 188, 154 205 C 154 220, 146 228, 140 215 Z" fill="url(#swSkinAnime)" stroke="#ca8a04" stroke-width="1"/>
    
    <!-- Tay Phải Nâng Linh Kiếm -->
    <path d="M 260 215 C 265 195, 272 185, 278 185 C 284 188, 280 205, 274 220 Z" fill="url(#swSkinAnime)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Khuôn Mặt Anime Tỷ Lệ Chuẩn Manhua -->
    <path d="M 188 120 C 188 140, 194 150, 200 154 C 206 150, 212 140, 212 120 Z" fill="url(#swSkinAnime)"/>
    <path d="M 176 95 C 176 126, 190 142, 200 145 C 210 142, 224 126, 224 95 C 224 68, 176 68, 176 95 Z" fill="url(#swSkinAnime)" stroke="#d97706" stroke-width="0.8"/>
    
    <!-- Đôi Mắt Kiếm Ý Anime Tinh Xảo -->
    <!-- Mắt Trái -->
    <path d="M 183 96 C 187 93, 193 93, 196 96" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="190" cy="98" rx="3.5" ry="4.5" fill="url(#swEyeCrystal)"/>
    <circle cx="189" cy="96.5" r="1.2" fill="#ffffff"/>
    <path d="M 181 90 C 186 87, 192 87, 196 90" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Mắt Phải -->
    <path d="M 204 96 C 207 93, 213 93, 217 96" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="210" cy="98" rx="3.5" ry="4.5" fill="url(#swEyeCrystal)"/>
    <circle cx="209" cy="96.5" r="1.2" fill="#ffffff"/>
    <path d="M 204 90 C 208 87, 214 87, 219 90" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Mũi & Miệng Thanh Tú -->
    <path d="M 200 102 C 200 108, 199 111, 201 112" fill="none" stroke="#d97706" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 196 122 C 198 120.5, 202 120.5, 204 122" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tóc Mái & Lọn Tóc Mai Tự Nhiên -->
    <path d="M 176 78 C 188 74, 200 80, 200 92 C 200 80, 212 74, 224 78 C 228 94, 226 116, 224 128 C 220 116, 218 100, 216 92 C 206 90, 202 90, 200 94 C 198 90, 194 90, 184 92 C 182 100, 180 116, 176 128 C 174 116, 172 94, 176 78 Z" fill="url(#swHairLux)"/>

    <!-- Phát Quan Hoàng Kim & Trâm Bạc -->
    <path d="M 192 64 C 196 58, 204 58, 208 64 L 212 72 C 204 74, 196 74, 188 72 Z" fill="url(#swGoldShine)" stroke="#ca8a04" stroke-width="1"/>
    <line x1="175" y1="68" x2="225" y2="68" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="200" cy="68" r="3" fill="#38bdf8"/>

    <!-- Thần Binh: Tru Tiên Thần Kiếm Rực Sáng Kiếm Ý -->
    <g id="swordsman-blade" transform="translate(280, 160) rotate(-20)" filter="url(#swSoftAura)">
      <path d="M 0 0 L 0 -220 L 9 -245 L 18 -220 L 18 0 Z" fill="url(#swBladeBeam)" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="9" y1="-230" x2="9" y2="-15" stroke="#0284c7" stroke-width="2"/>
      <path d="M -12 0 C 0 -6, 18 -6, 30 0 L 26 12 C 16 7, 2 7, -8 12 Z" fill="url(#swGoldShine)"/>
      <rect x="5" y="12" width="8" height="34" rx="2" fill="#0f172a" stroke="url(#swGoldShine)" stroke-width="1"/>
      <circle cx="9" cy="50" r="5.5" fill="url(#swGoldShine)"/>
      <path d="M 9 56 C 16 80, 4 105, 20 135 C 8 110, 14 85, 9 56 Z" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>
</svg>