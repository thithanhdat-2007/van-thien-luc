<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="100%" height="100%">
  <defs>
    <!-- Demon Gradients -->
    <linearGradient id="demonSkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="wingMembraneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="60%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- ĐÔI CÁNH HUYẾT DỰC GAI NHỌN (DEMONIC WINGS) -->
    <!-- Cánh Trái -->
    <g opacity="0.95">
      <!-- Xương cánh -->
      <path d="M 120 180 Q 50 110 10 70 Q 25 110 40 180 Q 20 220 5 270 Q 55 240 100 220 Z" fill="url(#wingMembraneGrad)" stroke="#f43f5e" stroke-width="1.5"/>
      <path d="M 120 180 L 10 70" stroke="#1c1917" stroke-width="6" stroke-linecap="round"/>
      <path d="M 10 70 L 0 50" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <!-- Gai cánh -->
      <polygon points="10,70 18,60 5,55" fill="#f59e0b"/>
      <polygon points="40,180 50,175 35,170" fill="#f59e0b"/>
    </g>

    <!-- Cánh Phải -->
    <g opacity="0.95">
      <!-- Xương cánh -->
      <path d="M 200 180 Q 270 110 310 70 Q 295 110 280 180 Q 300 220 315 270 Q 265 240 220 220 Z" fill="url(#wingMembraneGrad)" stroke="#f43f5e" stroke-width="1.5"/>
      <path d="M 200 180 L 310 70" stroke="#1c1917" stroke-width="6" stroke-linecap="round"/>
      <!-- Gai cánh -->
      <polygon points="310,70 302,60 315,55" fill="#f59e0b"/>
      <polygon points="280,180 270,175 285,170" fill="#f59e0b"/>
    </g>

    <!-- Đuôi bọ cạp ma đạo (Barbed Tail) -->
    <path d="M 160 340 Q 220 390 240 340 Q 250 290 230 260" fill="none" stroke="#881337" stroke-width="12" stroke-linecap="round"/>
    <polygon points="230,260 250,240 225,235" fill="#f59e0b" stroke="#e11d48" stroke-width="2"/>

    <!-- Chân Sau & Móng Vuốt Yêu Thú -->
    <path d="M 120 280 L 95 380 L 75 410 L 125 410 L 135 340 Z" fill="#1c1917" stroke="#4c0519" stroke-width="2"/>
    <path d="M 200 280 L 225 380 L 245 410 L 195 410 L 185 340 Z" fill="#1c1917" stroke="#4c0519" stroke-width="2"/>
    <!-- Vuốt nhọn cào sàn -->
    <polygon points="75,410 60,418 80,418" fill="#f59e0b"/>
    <polygon points="95,410 95,422 105,418" fill="#f59e0b"/>
    <polygon points="245,410 260,418 240,418" fill="#f59e0b"/>
    <polygon points="225,410 225,422 215,418" fill="#f59e0b"/>

    <!-- Thân Thể Ma Tộc Giáp Gai (Carapace & Torso) -->
    <path d="M 115 160 Q 160 140 205 160 L 215 280 Q 160 320 105 280 Z" fill="url(#demonSkinGrad)" stroke="#e11d48" stroke-width="2"/>
    <!-- Vảy Giáp Bụng Luyện Khí Bọ Hung -->
    <path d="M 130 180 Q 160 190 190 180 L 185 210 Q 160 220 135 210 Z" fill="#be123c"/>
    <path d="M 135 220 Q 160 230 185 220 L 180 250 Q 160 260 140 250 Z" fill="#be123c"/>
    <path d="M 140 260 Q 160 270 180 260 L 175 285 Q 160 295 145 285 Z" fill="#9f1239"/>

    <!-- Giáp Gai Vai Sừng Sỏ (Shoulder Spikes) -->
    <polygon points="105,160 65,130 100,180" fill="url(#hornGrad)" stroke="#e11d48" stroke-width="1.5"/>
    <polygon points="215,160 255,130 220,180" fill="url(#hornGrad)" stroke="#e11d48" stroke-width="1.5"/>

    <!-- Cánh tay & Móng vuốt xé xác -->
    <path d="M 110 180 Q 75 220 70 260 Q 90 265 110 220 Z" fill="url(#demonSkinGrad)"/>
    <polygon points="70,260 50,285 75,275" fill="#f59e0b"/>
    <polygon points="65,255 45,268 70,265" fill="#f59e0b"/>

    <path d="M 210 180 Q 245 220 250 260 Q 230 265 210 220 Z" fill="url(#demonSkinGrad)"/>
    <polygon points="250,260 270,285 245,275" fill="#f59e0b"/>
    <polygon points="255,255 275,268 250,265" fill="#f59e0b"/>

    <!-- Đầu Yêu Thú Hung Thần -->
    <polygon points="160,85 125,145 160,170 195,145" fill="#1c1917" stroke="#e11d48" stroke-width="2"/>
    <!-- Cặp Sừng Ác Quỷ Cong Vút -->
    <path d="M 135 105 Q 100 50 70 30 Q 95 65 120 115 Z" fill="url(#hornGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 185 105 Q 220 50 250 30 Q 225 65 200 115 Z" fill="url(#hornGrad)" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Đôi mắt đỏ rực sát khí phát sáng -->
    <ellipse cx="145" cy="130" rx="7" ry="4" fill="#fef08a" filter="url(#crimsonGlow)"/>
    <ellipse cx="175" cy="130" rx="7" ry="4" fill="#fef08a" filter="url(#crimsonGlow)"/>
    <ellipse cx="145" cy="130" rx="3" ry="2" fill="#ef4444"/>
    <ellipse cx="175" cy="130" rx="3" ry="2" fill="#ef4444"/>

    <!-- Hàm răng nanh đẫm máu -->
    <polygon points="145,150 150,162 155,150" fill="#fef08a"/>
    <polygon points="165,150 170,162 175,150" fill="#fef08a"/>
    <polygon points="152,165 160,152 168,165" fill="#fef08a"/>
  </g>
</svg>
