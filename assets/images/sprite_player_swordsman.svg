<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Gradients for Xianxia Swordsman -->
    <linearGradient id="daoRobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="innerRobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldTrimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="swordBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="swordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Aura Ribbon / Dải lụa tiên phong -->
    <path d="M 90 280 Q 40 330 20 400 Q 50 370 100 320 Z" fill="url(#daoRobeGrad)" opacity="0.6"/>
    <path d="M 200 270 Q 260 320 290 395 Q 250 360 185 305 Z" fill="url(#daoRobeGrad)" opacity="0.6"/>

    <!-- Tóc dài Tiên Hiệp bay trong gió -->
    <path d="M 125 75 Q 80 120 70 210 Q 100 170 135 125 Z" fill="#0f172a"/>
    <path d="M 130 65 Q 95 105 85 180 Q 110 145 138 105 Z" fill="#1e293b"/>

    <!-- Y Phục Thân Dưới (Quần & Tà Áo Dài) -->
    <path d="M 105 240 L 80 400 L 135 410 L 145 270 Z" fill="#0f172a"/>
    <path d="M 175 240 L 195 400 L 145 410 L 145 270 Z" fill="#0f172a"/>
    <!-- Giày chiến tu sĩ -->
    <path d="M 75 390 L 70 415 L 115 415 L 110 390 Z" fill="#1e293b" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 170 390 L 175 415 L 215 415 L 210 390 Z" fill="#1e293b" stroke="#ca8a04" stroke-width="2"/>

    <!-- Tà Áo Đạo Bào (Flowing Robes) -->
    <path d="M 95 160 L 70 340 Q 140 370 215 340 L 190 160 Z" fill="url(#daoRobeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 115 160 L 105 320 Q 140 335 175 320 L 165 160 Z" fill="url(#innerRobeGrad)"/>

    <!-- Thắt lưng ngọc bản to (Jade Sash) -->
    <rect x="100" y="210" width="80" height="22" rx="4" fill="url(#goldTrimGrad)"/>
    <rect x="125" y="206" width="30" height="30" rx="6" fill="#10b981" stroke="#fef08a" stroke-width="2"/>
    <circle cx="140" cy="221" r="5" fill="#fef08a"/>

    <!-- Cánh tay trái đưa về trước kết ấn -->
    <path d="M 95 150 Q 55 180 50 230 Q 70 235 90 200 Z" fill="url(#daoRobeGrad)"/>
    <!-- Bàn tay trái kết ấn Lôi Quyết -->
    <path d="M 45 225 Q 35 245 42 260 Q 55 255 60 235 Z" fill="#fcd34d" stroke="#b45309" stroke-width="1"/>

    <!-- Thân Trên & Cổ Áo Chéo (Cross-collar Hanfu) -->
    <path d="M 95 130 L 140 210 L 185 130 Z" fill="url(#innerRobeGrad)"/>
    <path d="M 105 130 L 140 190 L 155 130 Z" fill="url(#daoRobeGrad)"/>
    <path d="M 120 130 L 140 170 L 160 130 Z" fill="none" stroke="url(#goldTrimGrad)" stroke-width="3"/>

    <!-- Đầu & Khuôn Mặt Tu Sĩ -->
    <ellipse cx="140" cy="95" rx="26" ry="32" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <!-- Mắt phượng sắc lạnh -->
    <path d="M 125 92 Q 132 88 138 93" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 144 93 Q 150 88 157 92" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Đồng tử phát sáng xanh -->
    <circle cx="132" cy="94" r="2.5" fill="#38bdf8"/>
    <circle cx="150" cy="94" r="2.5" fill="#38bdf8"/>
    <!-- Trán ấn Thiên Môn (Forehead Mark) -->
    <path d="M 140 76 L 142 85 L 140 88 L 138 85 Z" fill="#ef4444"/>

    <!-- Tóc búi Quán Trâm (Daoist Hair Bun & Jade Pin) -->
    <path d="M 120 72 Q 140 45 160 72 Z" fill="#0f172a"/>
    <ellipse cx="140" cy="52" rx="16" ry="14" fill="#0f172a"/>
    <!-- Trâm cài vàng -->
    <line x1="110" y1="52" x2="175" y2="48" stroke="url(#goldTrimGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="112" cy="52" r="5" fill="#ef4444"/>

    <!-- Cánh tay phải cầm Bảo Kiếm chém vát -->
    <path d="M 185 145 Q 220 175 225 215 Q 205 225 180 185 Z" fill="url(#daoRobeGrad)"/>
    <path d="M 220 210 Q 235 225 242 220 Q 235 200 220 205 Z" fill="#fcd34d" stroke="#b45309" stroke-width="1"/>

    <!-- THANH PHI KIẾM BẢN MỆNH (CELESTIAL SWORD) -->
    <g transform="translate(20, -10)" filter="url(#swordGlow)">
      <!-- Chuôi kiếm chạm vàng -->
      <path d="M 215 230 L 235 210" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
      <circle cx="212" cy="233" r="5" fill="#ef4444"/>
      <!-- Ngăn kiếm Bát Quái -->
      <line x1="220" y1="205" x2="245" y2="230" stroke="url(#goldTrimGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Lưỡi kiếm phát quang sắc bén -->
      <path d="M 235 210 L 290 70 Q 295 55 288 65 L 243 205 Z" fill="url(#swordBladeGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <!-- Kiếm khí rạch trời (Sword Qi) -->
      <path d="M 285 55 L 295 40 Q 300 30 292 48 Z" fill="#bae6fd"/>
    </g>
  </g>
</svg>
