<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)" stroke="url(#cyanGlow)" fill="none" stroke-linecap="round">
    <!-- Outer concentric circles -->
    <circle cx="250" cy="250" r="235" stroke-width="2.5" stroke-dasharray="14 8 4 8" />
    <circle cx="250" cy="250" r="222" stroke-width="1.5" />
    <circle cx="250" cy="250" r="212" stroke-width="2" stroke-dasharray="3 5" />
    <circle cx="250" cy="250" r="185" stroke-width="1.8" />
    
    <!-- 12 Astrological / Formation Nodes -->
    <g stroke-width="1.5">
      <circle cx="250" cy="28" r="6" fill="#38bdf8" />
      <circle cx="250" cy="472" r="6" fill="#38bdf8" />
      <circle cx="28" cy="250" r="6" fill="#38bdf8" />
      <circle cx="472" cy="250" r="6" fill="#38bdf8" />
      <circle cx="93" cy="93" r="5" fill="#818cf8" />
      <circle cx="407" cy="93" r="5" fill="#818cf8" />
      <circle cx="93" cy="407" r="5" fill="#818cf8" />
      <circle cx="407" cy="407" r="5" fill="#818cf8" />
      <circle cx="140" cy="60" r="4" fill="#c084fc" />
      <circle cx="360" cy="60" r="4" fill="#c084fc" />
      <circle cx="140" cy="440" r="4" fill="#c084fc" />
      <circle cx="360" cy="440" r="4" fill="#c084fc" />
    </g>

    <!-- Star Octagram (Bát Quái Trận Đồ) -->
    <!-- Square 1 -->
    <polygon points="250,65 435,250 250,435 65,250" stroke-width="2" />
    <!-- Square 2 rotated 45 deg -->
    <polygon points="119,119 381,119 381,381 119,381" stroke-width="2" />
    
    <!-- Inner Runic Ring -->
    <circle cx="250" cy="250" r="145" stroke-width="2" stroke-dasharray="10 6 2 6" />
    <circle cx="250" cy="250" r="125" stroke-width="1.5" />
    
    <!-- Interlaced Triangles (Lục Hợp Khận Trận) -->
    <polygon points="250,125 358,312 142,312" stroke-width="2" />
    <polygon points="250,375 358,188 142,188" stroke-width="2" />
    
    <!-- Central Sanctum -->
    <circle cx="250" cy="250" r="68" stroke-width="2" stroke-dasharray="8 4" />
    <circle cx="250" cy="250" r="50" stroke-width="2" />
    <circle cx="250" cy="250" r="30" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="250" cy="250" r="12" fill="#38bdf8" fill-opacity="0.7" />

    <!-- Radiant Lines -->
    <line x1="250" y1="28" x2="250" y2="200" stroke-width="1.2" stroke-dasharray="8 6" />
    <line x1="250" y1="300" x2="250" y2="472" stroke-width="1.2" stroke-dasharray="8 6" />
    <line x1="28" y1="250" x2="200" y2="250" stroke-width="1.2" stroke-dasharray="8 6" />
    <line x1="300" y1="250" x2="472" y2="250" stroke-width="1.2" stroke-dasharray="8 6" />
  </g>
</svg>
