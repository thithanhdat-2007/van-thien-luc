<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vạn Cổ Tu Tiên — Bồng Lai Màn Hình Chính</title>
    <!-- Google Fonts Tiên Hiệp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Main Screen UI Styles -->
    <link rel="stylesheet" href="./css/main_screen_ui.css">
</head>
<body>

    <!-- ============================================================================
         PHẦN 1: BỐ CỤC TỔNG THỂ & CONTAINER CHÍNH (100VH, CĂN GIỮA MÀN HÌNH DỌC)
         ============================================================================ -->
    <main class="idle-app-viewport" role="main" aria-label="Giao diện tu luyện màn hình chính">
        
        <!-- NỀN (BACKGROUND) PHONG CÁCH BỒNG LAI TIÊN CẢNH -->
        <div class="fairy-background" aria-hidden="true">
            <!-- Setup sẵn div để chèn ảnh đồi núi sương mù phía sau -->
            <div class="scenery-layer" id="fairy-scenery"></div>
            <!-- Lớp sương mù lượn lờ bồng lai -->
            <div class="mist-layer"></div>
            <!-- Vệt bóng núi xa xa -->
            <div class="mountain-peaks-silhouette"></div>
        </div>

        <!-- TOP BAR MINI: TỌA ĐỘ VÀ TÀI NGUYÊN TIÊN HIỆP -->
        <header class="fairy-header">
            <div class="sect-location-badge">
                <i class="fa-solid fa-mountain-sun"></i>
                <span>[HẠ GIỚI] Thanh Tiêu Phong</span>
            </div>
            <div class="resource-pill">
                <i class="fa-solid fa-gem"></i>
                <span id="spirit-stones-val">5,280</span>
            </div>
        </header>

        <!-- ============================================================================
             PHẦN 2: KHU VỰC TRUNG TÂM (NHÂN VẬT & NÚT BAY FLOATING ORBS)
             ============================================================================ -->
        <section class="cultivator-stage" aria-label="Khu vực nhân vật ngồi thiền">
            
            <div class="character-float-wrapper">
                
                <!-- Bệ sen đả tọa phát sáng dưới chân -->
                <div class="lotus-pedestal-glow" aria-hidden="true"></div>

                <!-- 1. NHÂN VẬT TRUNG TÂM (NGỒI THIỀN + ANIMATION LƠ LỬNG + AURA ĐAN ĐIỀN) -->
                <div class="cultivator-img-container" id="character-floating-body">
                    <!-- Thẻ <img> nhân vật ngồi thiền -->
                    <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop" 
                         alt="Nữ Tu Đả Tọa Nhập Định" 
                         class="cultivator-portrait" 
                         id="main-character-img">

                    <!-- Hào quang (Aura) hình tròn phát sáng và xoay chậm ở giữa bụng (Đan Điền) -->
                    <div class="dantian-aura-orb" id="dantian-aura">
                        <div class="dantian-rotator" aria-hidden="true"></div>
                        <div class="dantian-core-pulse" aria-hidden="true"></div>
                    </div>
                </div>

                <!-- 2. NÚT TÍNH NĂNG TRÔI NỔI: BÊN TRÁI ("ĐỘ KIẾP" - MÀU CAM/VÀNG LỬA) -->
                <button type="button" class="floating-orb orb-left-tribulation" id="btn-tribulation-orb" aria-label="Độ Kiếp Bình Cảnh">
                    <div class="orb-circle">
                        <i class="fa-solid fa-bolt-lightning"></i>
                    </div>
                    <span class="orb-label-main">Độ Kiếp</span>
                    <span class="orb-subtext">
                        Trúc Cơ Kỳ<br>
                        <strong>Cần: 1.2K / 1.2K</strong>
                    </span>
                </button>

                <!-- 2. NÚT TÍNH NĂNG TRÔI NỔI: BÊN PHẢI ("TÂM MA" - MÀU XANH DƯƠNG/TÍM) -->
                <button type="button" class="floating-orb orb-right-demon" id="btn-demon-orb" aria-label="Thanh Tẩy Tâm Ma">
                    <div class="orb-circle">
                        <i class="fa-solid fa-fire-flame-curved"></i>
                    </div>
                    <span class="orb-label-main">Tâm Ma</span>
                    <span class="orb-subtext">
                        Tiến độ: <strong>35%</strong><br>
                        Trảm Ma: 3/10
                    </span>
                </button>

            </div>

        </section>

        <!-- ============================================================================
             PHẦN 3: KHU VỰC THÔNG SỐ & TU LUYỆN (BOTTOM INFO DƯỚI CHÂN NHÂN VẬT)
             ============================================================================ -->
        <section class="cultivation-control-panel" aria-label="Bảng điều khiển tu vi">
            
            <!-- 1. Khung hiển thị thông số tu vi -->
            <div class="cultivation-stats-card">
                <div class="stat-line-breakthrough">
                    <span><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Tu Vi để đột phá:</span>
                    <span class="stat-highlight" id="breakthrough-progress-text">111 / 600</span>
                </div>

                <!-- Thanh tiến độ tu vi ngọc bích -->
                <div class="mini-progress-track" role="progressbar" aria-valuenow="111" aria-valuemin="0" aria-valuemax="600">
                    <div class="mini-progress-fill" id="cultivation-progress-bar" style="width: 18.5%;"></div>
                </div>

                <div class="stat-line-rate">
                    <span><i class="fa-solid fa-bolt mr-1 text-emerald-600"></i> Suất tu luyện:</span>
                    <span class="rate-badge" id="cultivation-rate-text">26 ~ 43 / 5 giây</span>
                </div>
            </div>

            <!-- 2 & 3. Cụm Nút Thao Tác: Menu Hình Thoi (Hai bên) + Nút Tu Luyện Oval (Chính giữa) -->
            <div class="action-buttons-cluster">
                
                <!-- Nút Phụ Góc Cạnh (Hình Thoi) Bên Trái: "Linh Căn" -->
                <button type="button" class="rhombus-btn-wrap" id="btn-spiritual-root" aria-label="Mở bảng Linh Căn">
                    <div class="rhombus-shape">
                        <div class="rhombus-content">
                            <i class="fa-solid fa-seedling"></i>
                        </div>
                    </div>
                    <span class="rhombus-label">Linh Căn</span>
                </button>

                <!-- Nút Chính Ở Giữa: "Tu Luyện" (Hình Oval Vàng Kim Nổi Bật) -->
                <button type="button" class="cultivate-main-btn" id="btn-main-cultivate" onclick="triggerCultivateClick(event)" aria-label="Tụ khí tu luyện">
                    <i class="fa-solid fa-yin-yang"></i>
                    <span>Tu Luyện</span>
                </button>

                <!-- Nút Phụ Góc Cạnh (Hình Thoi) Bên Phải: "Công Pháp" -->
                <button type="button" class="rhombus-btn-wrap" id="btn-kungfu" aria-label="Mở bảng Công Pháp">
                    <div class="rhombus-shape">
                        <div class="rhombus-content">
                            <i class="fa-solid fa-book-journal-whills"></i>
                        </div>
                    </div>
                    <span class="rhombus-label">Công Pháp</span>
                </button>

            </div>

        </section>

        <!-- ============================================================================
             PHẦN 4: THANH ĐIỀU HƯỚNG DƯỚI CÙNG (BOTTOM NAV BAR GLASSMORPHISM)
             ============================================================================ -->
        <nav class="bottom-nav-glass" role="navigation" aria-label="Thanh điều hướng trò chơi">
            
            <!-- 1. Nhân Vật (Active) -->
            <button type="button" class="nav-item active" aria-label="Nhân Vật" onclick="setActiveNav(this)">
                <i class="fa-solid fa-user-ninja"></i>
                <span>Nhân Vật</span>
            </button>

            <!-- 2. Hành Trang -->
            <button type="button" class="nav-item" aria-label="Hành Trang" onclick="setActiveNav(this)">
                <i class="fa-solid fa-sack-dollar"></i>
                <span>Hành Trang</span>
            </button>

            <!-- 3. Trấn Yêu Tháp -->
            <button type="button" class="nav-item" aria-label="Trấn Yêu Tháp" onclick="setActiveNav(this)">
                <i class="fa-solid fa-dungeon"></i>
                <span>Trấn Yêu Tháp</span>
            </button>

            <!-- 4. Tông Môn -->
            <button type="button" class="nav-item" aria-label="Tông Môn" onclick="setActiveNav(this)">
                <i class="fa-solid fa-synagogue"></i>
                <span>Tông Môn</span>
            </button>

            <!-- 5. Tiên Duyên -->
            <button type="button" class="nav-item" aria-label="Tiên Duyên" onclick="setActiveNav(this)">
                <i class="fa-solid fa-spa"></i>
                <span>Tiên Duyên</span>
            </button>

        </nav>

    </main>

    <!-- Mini Script Tương Tác Trực Quan -->
    <script>
        // Hiệu ứng bấm nút Tu Luyện sinh hoa khí & tăng tu vi mẫu
        let currentExp = 111;
        const maxExp = 600;

        function triggerCultivateClick(event) {
            currentExp = Math.min(maxExp, currentExp + Math.floor(Math.random() * 8) + 5);
            const textEl = document.getElementById('breakthrough-progress-text');
            const barEl = document.getElementById('cultivation-progress-bar');
            if (textEl && barEl) {
                textEl.textContent = `${currentExp} / ${maxExp}`;
                barEl.style.width = `${(currentExp / maxExp) * 100}%`;
            }

            // Tạo hiệu ứng hạt bay lấp lánh (Floating Qi Spark)
            const btn = event.currentTarget;
            const spark = document.createElement('span');
            spark.innerHTML = '+Tiên Khí';
            spark.style.position = 'absolute';
            spark.style.left = '50%';
            spark.style.top = '-10px';
            spark.style.transform = 'translate(-50%, -50%)';
            spark.style.color = '#f59e0b';
            spark.style.fontWeight = '900';
            spark.style.fontSize = '12px';
            spark.style.pointerEvents = 'none';
            spark.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
            spark.style.opacity = '1';
            spark.style.textShadow = '0 0 10px #fbbf24';
            btn.appendChild(spark);

            requestAnimationFrame(() => {
                spark.style.top = '-35px';
                spark.style.opacity = '0';
            });
            setTimeout(() => spark.remove(), 850);
        }

        // Chuyển Tab Điều Hướng Đáy
        function setActiveNav(btn) {
            document.querySelectorAll('.bottom-nav-glass .nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
